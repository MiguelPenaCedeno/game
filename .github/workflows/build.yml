name: Pruebas y ejecutables (Windows y Android)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Instalar Godot y plantillas de Windows y Android
        run: |
          if [ ! -f ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm g.zip
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/windows_release_x86_64.exe" ] || [ ! -f "$T/android_release.apk" ]; then
            mkdir -p "$T"
            curl -sSL -o /tmp/t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -o -j -q /tmp/t.tpz templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
              templates/android_release.apk templates/android_debug.apk templates/version.txt -d "$T"
            rm /tmp/t.tpz
          fi
          ~/godot/godot --version

      - name: Pruebas automáticas
        run: godot/tests/run_all.sh ~/godot/godot

      - name: Exportar a Windows
        run: |
          mkdir -p builds/windows
          cd godot
          ~/godot/godot --headless --export-release "Windows" ../builds/windows/PuebloMuerto.exe
          cd ../builds
          test -s windows/PuebloMuerto.exe
          cp ../README.md windows/LEEME.md
          (cd windows && zip -q -r ../PuebloMuerto-windows.zip .)
          ls -la

      - name: Exportar a Android (APK)
        env:
          # clave de firma del juego (para poder actualizar la app sin desinstalarla)
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/.github/android/pueblo-muerto.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: pueblomuerto
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: pueblomuerto
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.github/android/pueblo-muerto.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: pueblomuerto
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: pueblomuerto
        run: |
          # el SDK de Android y Java 17 ya vienen en la máquina de GitHub
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          JDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          echo "SDK: $SDK · JDK: $JDK"
          ls "$SDK/build-tools" || true
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JDK" > ~/.config/godot/$f
          done
          mkdir -p builds
          cd godot
          ~/godot/godot --headless --export-release "Android" ../builds/PuebloMuerto-android.apk
          test -s ../builds/PuebloMuerto-android.apk
          # la misma app con gráficos OpenGL, para móviles a los que Vulkan les da problemas
          # (se fuerza también el renderizador del móvil, por si la etiqueta "compat" no bastara)
          cp project.godot /tmp/project.godot.bak
          sed -i 's/^\[rendering\]$/[rendering]\n\nrenderer\/rendering_method.mobile="gl_compatibility"/' project.godot
          grep -n "rendering_method" project.godot
          ~/godot/godot --headless --export-release "Android (compatible)" ../builds/PuebloMuerto-android-compatible.apk
          cp /tmp/project.godot.bak project.godot
          test -s ../builds/PuebloMuerto-android-compatible.apk
          ls -la ../builds

      - name: Guardar los ejecutables en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: PuebloMuerto
          path: |
            builds/PuebloMuerto-windows.zip
            builds/PuebloMuerto-android.apk
            builds/PuebloMuerto-android-compatible.apk

      - name: Publicar en "Releases" (versión más reciente)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f ultima
          git push -f origin ultima
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Pueblo Muerto (última versión)
          make_latest: true
          body: |
            Versión generada automáticamente desde `main` (${{ github.sha }}).

            **Cómo jugar en Windows:** descarga `PuebloMuerto-windows.zip`, descomprímelo y abre `PuebloMuerto.exe`.
            Windows puede avisar de que es una app desconocida (no está firmada): pulsa *Más información* → *Ejecutar de todas formas*.

            **Cómo jugar en Android:** descarga `PuebloMuerto-android.apk` en el móvil y ábrelo. Android pedirá permiso
            para instalar apps de origen desconocido (solo la primera vez). Se juega con controles táctiles o con un mando.
            Si el juego se cierra solo en tu móvil, prueba `PuebloMuerto-android-compatible.apk` (gráficos OpenGL,
            se instala encima de la otra y conserva la partida). Al volver a abrirlo, el juego enseña un informe para copiarlo.

            Para jugar juntos, uno pulsa *Crear partida* y el otro se une con su IP (mira el LEEME.md).
          files: |
            builds/PuebloMuerto-windows.zip
            builds/PuebloMuerto-android.apk
            builds/PuebloMuerto-android-compatible.apk
